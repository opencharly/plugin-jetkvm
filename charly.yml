# Makes this plugin repo a PROJECT so its own candy is actually gated.
#
# Without a root charly.yml the repo is "project-less": charly scans NO candies
# at all, so `charly box validate` at the repo root exits 0 on ANY manifest,
# including one with a malformed `plugin.providers` entry. Declaring discover:
# is the whole fix: the candy is scanned, the CUE schema gate applies, and the
# stock `charly box validate` step starts working with no workflow change.
version: 2026.261.1747
discover:
    - path: candy
      recursive: true

# A disposable LOCAL bed proving the plugin's verb is registered and its verdict
# path runs end to end through the real provider registry. `disposable: true` is
# the sole authorization for autonomous teardown, and this bed touches nothing
# but the registry: the verb reports the documented live-device skip because no
# JetKVM address is authored. Kept `host: local` so the bed runs anywhere.
#
# The plan lives on the DEPLOY node, not the template: a composed template's
# `plan:` is never surfaced to a deploy-scope check runner for a non-image
# deploy, so a check authored only on the template passes asserting nothing.
jetkvm-verb-probe:
    local:
        from: jetkvm-probe-host
        host: local
        disposable: true
        plan:
            - check: the jetkvm verb dispatches through the provider registry and reports its documented no-device skip (proving the out-of-process plugin connected and its verdict path ran)
              id: jetkvm-dispatch-probe
              jetkvm: status
              stdout:
                - contains: skip
              context:
                - runtime
jetkvm-probe-host:
    local:
        description: minimal kind:local template for the jetkvm verb-dispatch bed
        candy: []

# The REAL-DEVICE bed, read-only. The device ADDRESS and the session token are
# supplied at run time via JETKVM_HOST and JETKVM_AUTH_TOKEN (or the credential
# store) and are NEVER committed — no device-specific hostname appears in this
# file. Read-only methods need no allow_control, so this bed can never actuate
# the appliance. Run it with:
#
#   JETKVM_HOST=<device-host> JETKVM_AUTH_TOKEN=<token> \
#     charly check run jetkvm-device-readonly
jetkvm-device-readonly:
    local:
        from: jetkvm-device-host
        host: local
        disposable: true
        plan:
            - check: the JetKVM is reachable and its control channel answers (device identity + firmware over the live WebRTC/JSON-RPC wire)
              id: jetkvm-device-status
              jetkvm:
                  method: status
              stdout:
                  - contains: "jetkvm:    ok"
                  - contains: "rpc:       true"
              context:
                  - runtime
              eventually: 60s
              retry_interval: 5s
            - check: a fresh 1080p framebuffer is captured from the live device and written as a real PNG (artifact-reality asserted, not just "the call returned")
              id: jetkvm-device-screenshot
              jetkvm:
                  method: screenshot
                  artifact: /tmp/jetkvm-bed-shot.png
                  artifact_min_bytes: 20000
                  artifact_min_dimensions: 640x480
              context:
                  - runtime
              eventually: 60s
              retry_interval: 5s
jetkvm-device-host:
    local:
        description: minimal kind:local template for the real-device read-only bed
        candy: []

# The READ-ONLY method-surface bed: exercises one representative method from each
# read-only family against the live device, proving the catalog's dispatch and
# JSON rendering beyond status/screenshot. Nothing here mutates the appliance.
jetkvm-device-methods:
    local:
        from: jetkvm-methods-host
        host: local
        disposable: true
        plan:
            - check: the device identity and firmware are reported over the live wire
              id: jk-status
              jetkvm: {method: status}
              stdout:
                  - contains: "rpc:       true"
              context: [runtime]
            - check: the local app/system versions are reported
              id: jk-version
              jetkvm: {method: version}
              stdout:
                  - contains: "appVersion"
              context: [runtime]
            - check: the video pipeline state is reported (ready reflects the capture pipeline, not signal)
              id: jk-video-state
              jetkvm: {method: video-state}
              stdout:
                  - contains: "ready"
              context: [runtime]
            - check: the USB gadget state is reported
              id: jk-usb-state
              jetkvm: {method: usb-state}
              stdout:
                  - contains: "configured"
              context: [runtime]
            - check: the ATX power/HDD LED state is reported
              id: jk-atx-state
              jetkvm: {method: atx-state}
              stdout:
                  - contains: "power"
              context: [runtime]
            - check: the DC power state is reported
              id: jk-dc-state
              jetkvm: {method: dc-state}
              stdout:
                  - contains: "isOn"
              context: [runtime]
            - check: the virtual media state is reported
              id: jk-vm-state
              jetkvm: {method: virtual-media-state}
              stdout:
                  - contains: "null"
              context: [runtime]
            - check: the device storage listing is reported
              id: jk-storage
              jetkvm: {method: storage-files}
              stdout:
                  - contains: "files"
              context: [runtime]
            - check: the keyboard layout is reported
              id: jk-layout
              jetkvm: {method: keyboard-layout}
              stdout:
                  - contains: "en-US"
              context: [runtime]
            - check: the network state is reported
              id: jk-net-state
              jetkvm: {method: network-state}
              stdout:
                  - contains: "dhcp_lease"
              context: [runtime]
            - check: the network settings are reported
              id: jk-net-settings
              jetkvm: {method: network-settings}
              stdout:
                  - contains: "dhcp_client"
              context: [runtime]
            - check: the tailscale status is reported
              id: jk-tailscale
              jetkvm: {method: tailscale-status}
              stdout:
                  - contains: "backendState"
              context: [runtime]
            - check: the available extensions and the active one are reported
              id: jk-extensions
              jetkvm: {method: extensions}
              stdout:
                  - contains: "supported: atx-power, dc-power"
              context: [runtime]
            - check: the diagnostics summary collects the device facts
              id: jk-diagnostics
              jetkvm: {method: diagnostics}
              stdout:
                  - contains: "device_id:"
              context: [runtime]
            - check: the raw JSON-RPC escape hatch round-trips a device call
              id: jk-rpc
              jetkvm: {method: rpc, rpc_method: ping}
              stdout:
                  - contains: "pong"
              context: [runtime]
jetkvm-methods-host:
    local:
        description: minimal kind:local template for the read-only method-surface bed
        candy: []

# The INPUT bed: drives input (pointer move + a typed string) between two
# screenshots, proving the mutating path end to end. Env-driven like the
# read-only beds (JETKVM_HOST + JETKVM_AUTH_TOKEN); every mutating method carries
# allow_control: true — the device-safety gate.
#
# `disposable: true` here refers to the LOCAL check deployment (the host-local
# `charly` deploy the bed creates), NOT to the JetKVM: the appliance is a
# physical device and is never disposable. It types into whatever machine the KVM
# is attached to, so run it only when that is intended.
#
#   JETKVM_HOST=<device-host> JETKVM_AUTH_TOKEN=<token> \
#     charly check run jetkvm-input-probe
#
# The typed text is a harmless marker; pick one that is safe for the attached
# host (a shell prompt, an empty editor, etc.).
jetkvm-input-probe:
    local:
        from: jetkvm-input-host
        host: local
        disposable: true
        plan:
            - check: baseline screenshot before any input
              id: jkctl-before
              jetkvm:
                  method: screenshot
                  artifact: /tmp/jetkvm-control-before.png
                  artifact_min_bytes: 20000
              context: [runtime]
              eventually: 60s
              retry_interval: 5s
            - check: move the pointer to the screen centre (HID-absolute 16384,16384 — not pixels)
              id: jkctl-move
              jetkvm:
                  method: move
                  x: 16384
                  y: 16384
                  allow_control: true
              context: [runtime]
              eventually: 60s
              retry_interval: 5s
            - check: click with no button (exercises the documented left default)
              id: jkctl-click
              jetkvm:
                  method: click
                  x: 16384
                  y: 16384
                  allow_control: true
              context: [runtime]
              eventually: 60s
              retry_interval: 5s
            - check: drag with no button (exercises the drag left default)
              id: jkctl-drag
              jetkvm:
                  method: drag
                  from_x: 9000
                  from_y: 11000
                  x: 22000
                  y: 15000
                  allow_control: true
              context: [runtime]
              eventually: 60s
              retry_interval: 5s
            - check: press a named key (F5 — exercises the general key resolver)
              id: jkctl-key
              jetkvm:
                  method: key
                  key: "F5"
                  allow_control: true
              context: [runtime]
              eventually: 60s
              retry_interval: 5s
            - check: press a modifier chord (exercises the general combo resolver)
              id: jkctl-combo
              jetkvm:
                  method: key-combo
                  combo: "ctrl+shift+t"
                  allow_control: true
              context: [runtime]
              eventually: 60s
              retry_interval: 5s
            - check: type a harmless marker string
              id: jkctl-type
              jetkvm:
                  method: type
                  text: "jetkvm-ok"
                  allow_control: true
              context: [runtime]
              eventually: 60s
              retry_interval: 5s
            - check: screenshot after the input, so a change can be compared
              id: jkctl-after
              jetkvm:
                  method: screenshot
                  artifact: /tmp/jetkvm-control-after.png
                  artifact_min_bytes: 20000
              context: [runtime]
              eventually: 60s
              retry_interval: 5s
            - check: the HID wake report reaches the controlled host (upstream's wakeHost RPC; wakes a display-asleep host)
              id: jkctl-wake-host
              jetkvm:
                  method: wake-host
                  allow_control: true
              stdout:
                  - contains: "HID wake report sent"
              context: [runtime]
jetkvm-input-host:
    local:
        description: minimal kind:local template for the input bed
        candy: []

# The OCR bed, read-only: proves the new `ocr` method reads the live screen and
# asserts text, and that a NEGATIVE assertion fails loudly (the validator really
# reads pixels, not passing vacuously). Env-driven like the other device beds.
#
#   JETKVM_HOST=<device-host> JETKVM_AUTH_TOKEN=<token> \
#     charly check run jetkvm-ocr-readonly
jetkvm-ocr-readonly:
    local:
        from: jetkvm-ocr-host
        host: local
        disposable: true
        plan:
            - check: the ocr method reads the live screen and finds on-screen text (the Omarchy wordmark, present on both the installer and the installed desktop — this bed proves the read, not a wizard transition; the screen-unique anchor rule belongs to recipe steps, not here)
              id: jk-ocr-positive
              jetkvm:
                  method: ocr
                  text: omarch
              context: [runtime]
              eventually: 60s
              retry_interval: 5s
            - check: a screenshot with artifact_contains_text proves the OCR validator reads the PULLED PNG (the wait-for-screen primitive in screenshot form)
              id: jk-artifact-text
              jetkvm:
                  method: screenshot
                  artifact: /tmp/jetkvm-ocr-artifact.png
                  artifact_min_bytes: 20000
                  artifact_contains_text: omarch
              context: [runtime]
              eventually: 60s
              retry_interval: 5s
            - check: a NEGATIVE ocr assertion fails loudly (proving the method reads pixels, not passing vacuously) — asserted by requiring exit 1 and the not-found message
              id: jk-ocr-negative
              jetkvm:
                  method: ocr
                  text: ZZZ-definitely-not-on-any-screen-ZZZ
              exit_status: 1
              stderr:
                  - contains: "does not contain"
              context: [runtime]
              eventually: 12s
              retry_interval: 4s
jetkvm-ocr-host:
    local:
        description: minimal kind:local template for the OCR bed
        candy: []

# The INSTALL-DRIVER bed, read-only in EFFECT: it drives the first two wizard
# transitions and then STOPS before anything is written to disk (no disk step is
# reached). It proves the `install` method walks a recipe, OCR-gates each screen
# and sends input on ONE session — the mechanism, exercised live without wiping a
# machine. The FULL destructive install is a deliberate operator action (the
# check-omarchy-jetkvm-install bed in distro-omarchy), never CI.
#
#   JETKVM_HOST=<device-host> JETKVM_AUTH_TOKEN=<token> \
jetkvm-entity:
    jetkvm:
        description: >-
            Minimal console-recipe entity for the entity-resolution bed. Its
            recipe waits for the Omarchy wordmark (present on the installer AND
            the installed desktop) then presses F5 (a harmless function key), so
            the entity path, the install driver AND the transport's PressKey are
            provable live without wiping a machine.
        installer:
            recipes:
                probe:
                    - wait_for: omarch
                      action: key
                      key: F5
                      description: wait for the Omarchy wordmark, then press F5 (a harmless function key that exercises the transport's PressKey live)
jetkvm-entity-probe:
    local:
        from: jetkvm-entity-host
        host: local
        disposable: true
        plan:
            - check: "a step naming a `kind: jetkvm` entity resolves it over the reverse channel and reads the device (the live entity-resolution path)"
              id: jke-status
              jetkvm:
                  method: status
                  device: jetkvm-entity
              stdout:
                  - contains: "rpc:       true"
              context: [runtime]
              eventually: 60s
              retry_interval: 5s
            - check: "an install step with `device:`+`recipe:` walks the entity's named recipe through the shared engine (OCR-wait then F5 — non-destructive)"
              id: jke-install
              jetkvm:
                  method: install
                  device: jetkvm-entity
                  recipe: probe
                  allow_control: true
              stdout:
                  - contains: "step 1"
              context: [runtime]
              eventually: 120s
              retry_interval: 5s
            - check: "an install step with an INLINE `steps:` recipe (no `device:`) walks that recipe through the shared engine — the inline branch of runInstall (OCR-wait then F6 — non-destructive)"
              id: jke-inline
              jetkvm:
                  method: install
                  allow_control: true
                  steps:
                      - wait_for: omarch
                        action: key
                        key: F6
                        description: wait for the Omarchy wordmark, then press F6
              stdout:
                  - contains: "step 1"
              context: [runtime]
              eventually: 120s
              retry_interval: 5s
jetkvm-entity-host:
    local:
        description: minimal kind:local template for the entity-resolution bed
        candy: []

# The console-SESSION/FLOW bed: proves the new terminal-session surface end to
# end on a machine sitting at a LOGIN prompt — a `flow` logs in (username +
# password + named-outcome routing), reaching a shell, then `run-command` reads
# the OS id by OCR (marker-line completion, with prompt preflight) in that shell.
# NON-DESTRUCTIVE (reads only). Credentials come from the host environment via
# `answers_env` (never committed).
#
#   JETKVM_HOST=<device-host> JETKVM_AUTH_TOKEN=<token> \
#     OMARCHY_KVM_USER=omarchy OMARCHY_KVM_PASSWORD=<pw> \
#     charly check run jetkvm-console-session
jetkvm-console-session:
    local:
        from: jetkvm-console-host
        host: local
        disposable: true
        plan:
            - check: a flow logs in (named outcomes + routing) and reaches a shell
              id: jkcs-login
              jetkvm:
                  method: flow
                  allow_control: true
                  flow_start: login
                  flow_nodes:
                      login:
                          wait: [{name: prompt, match: "login:"}]
                          text: "{{user}}"
                          next: subuser
                      subuser:
                          description: submit the username; on a rejected/re-shown login, loop back to re-type
                          wait: [{name: pw, match: "Password:"}, {name: again, match: "login:"}]
                          key: Return
                          transitions: {pw: typepw, again: login}
                      typepw:
                          wait: [{name: pw, match: "Password:"}]
                          text: "{{password}}"
                          next: subpw
                      subpw:
                          wait: [{name: pw, match: "Password:"}]
                          key: Return
                          next: shell
                      shell:
                          wait: [{name: ready, match: "~"}, {name: fail, match: "incorrect", failure: true}]
                          command: "echo JETKVM_LOGIN_OK"
                          expect: "JETKVM_LOGIN_OK"
                          timeout_sec: 60
                  answers_env:
                      user: OMARCHY_KVM_USER
                      password: OMARCHY_KVM_PASSWORD
              stdout:
                  - contains: "flow completed at node"
              context: [runtime]
              timeout: 180s
            - check: run-command reads the OS id in the now-open shell (marker-line completion + prompt preflight)
              id: jkcs-run-command
              jetkvm:
                  method: run-command
                  allow_control: true
                  prompt_anchors: ["~", "#", "$"]
                  commands:
                      - command: "cat /etc/os-release | grep ^ID="
                        expect: "omarchy"
                        timeout_sec: 30
              context: [runtime]
              timeout: 90s

jetkvm-console-host:
    local:
        description: minimal kind:local template for the console-session bed
        candy: []
