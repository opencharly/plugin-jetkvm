# golangci-lint config for the plugin-jetkvm module.
#
# Mirrors charly's root candy config (`default: standard` + gofmt), with ONE
# addition this repository genuinely needs: the vendored third-party client
# under internal/kvmclient is EXCLUDED from lint findings.
#
# Why an exclusion rather than edits: that code is copied from MIT/BSD-licensed
# upstream projects (see third_party/NOTICE) that did not run this project's
# linter. Rewriting it to satisfy our linter would (a) diverge the vendored copy
# from its upstream provenance, making a future re-vendor a merge instead of a
# copy, and (b) review third-party style as if it were our code. The exclusion is
# scoped to the vendored PATHS, so every file this project authors is held to
# the full standard set.
version: "2"

run:
  timeout: 10m

linters:
  default: standard
  settings:
    errcheck:
      # The SAME exclusions charly's root config carries: a deferred best-effort
      # Close on a response body or handle is the idiomatic form.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
  exclusions:
    paths:
      # Vendored upstream client + its vendored test suite (third_party/NOTICE).
      - internal/kvmclient
      # Vendored upstream fake-device test fixture (third_party/NOTICE).
      - internal/fakedevice

formatters:
  enable:
    - gofmt
